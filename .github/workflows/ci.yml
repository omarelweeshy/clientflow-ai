name: Verify ClientFlow
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clientflow_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test -d clientflow_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/clientflow_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend scripts
      - run: python scripts/check_exports.py
      - run: python scripts/scan_secrets.py
      - run: alembic upgrade head && alembic current && pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
  public-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_DEMO_MODE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start demo and wait for readiness
        working-directory: frontend
        run: |
          mkdir -p ../.release-check
          npm run start -- --hostname 127.0.0.1 --port 3011 > ../.release-check/public-demo-server.log 2>&1 &
          node --input-type=module -e 'for (let i=0;i<60;i++) { try { const r=await fetch("http://localhost:3011/login"); if(r.ok) process.exit(0); } catch {} await new Promise(r=>setTimeout(r,1000)); } process.exit(1);'
      - run: node scripts/public-demo-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-demo-browser-evidence
          path: .release-check/public-demo-screenshots
          retention-days: 7
